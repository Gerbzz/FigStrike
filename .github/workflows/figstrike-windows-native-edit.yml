name: FigStrike Windows native edit proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/figstrike-windows-native-edit.yml
      - scripts/ci_windows_native_edit.py
      - assets/branding/**
      - assets/app-icon/**
      - apps/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
  push:
    branches: [feature/figstrike-workflow-evidence]
    paths:
      - .github/workflows/figstrike-windows-native-edit.yml
      - scripts/ci_windows_native_edit.py
      - apps/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-edit-roundtrip:
    if: github.repository == 'Gerbzz/FigStrike'
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build native editor
        shell: pwsh
        run: cargo build --locked -p figcraft
      - name: Create, keyboard edit, save, reopen, and inspect in native Windows editor
        shell: pwsh
        run: |
          python scripts/ci_windows_native_edit.py target/debug/figcraft.exe "$env:RUNNER_TEMP/figstrike-native-edit"
          if ($LASTEXITCODE -ne 0) { throw 'FigStrike native edit round trip failed' }
      - name: Record exact source and native screenshot hashes
        shell: pwsh
        env:
          SCREENSHOT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:SCREENSHOT_EXPECTED_HEAD) { throw 'Screenshot checkout differs from requested source head' }
          $folder = (Join-Path $env:RUNNER_TEMP 'figstrike-native-edit')
          $images = @()
          foreach ($relative in @('native-edited.png')) {
            $file = Get-Item -LiteralPath (Join-Path $folder $relative)
            if ($file.Length -eq 0) { throw "Empty native screenshot: $relative" }
            $images += [ordered]@{
              file = $relative
              bytes = $file.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            source_head = $head
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            captured_at_utc = [DateTime]::UtcNow.ToString('o')
            method = 'Running FigStrike native editor ui.screenshot after original keyboard edit, save and reopen acceptance'
            fixture = 'Repository-generated synthetic test material; no user project or capture device opened'
            images = $images
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $folder 'screenshot-provenance.json')
          git diff --exit-code -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock changed during capture' }
      - name: Preserve small native editing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: figstrike-windows-native-edit-evidence
          path: |
            ${{ runner.temp }}/figstrike-native-edit/native-edited.figcraft
            ${{ runner.temp }}/figstrike-native-edit/native-edited.png
            ${{ runner.temp }}/figstrike-native-edit/native-edit-verification.json
            ${{ runner.temp }}/figstrike-native-edit/native-first-launch.log
            ${{ runner.temp }}/figstrike-native-edit/native-reopen.log
            ${{ runner.temp }}/figstrike-native-edit/screenshot-provenance.json
          retention-days: 7
          if-no-files-found: ignore
