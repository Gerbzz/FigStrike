name: FigStrike source and workflow smoke

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - full
          - startup

permissions:
  contents: read

jobs:
  entry-point:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Run the FigStrike verification branch for the full source and workflow smoke."
